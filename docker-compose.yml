services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgetdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgetdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://widget:widget@db:5432/widgetdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
